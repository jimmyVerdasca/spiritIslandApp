name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: "Clean Buildozer Android cache before building"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.10.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Verify Python
        run: |
          which python
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Set Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> $GITHUB_PATH

      - name: Install pinned Python tooling
        run: |
          python -m pip install \
            pip==23.3.2 \
            setuptools==68.2.2 \
            wheel==0.41.3

          python -m pip install \
            buildozer==1.6.0 \
            python-for-android==2024.04.01 \
            cython==0.29.36

      - name: Verify Buildozer stack
        run: |
          python --version
          python -m pip --version
          buildozer --version
          python -m pip show cython

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Clean Buildozer cache
        if: ${{ inputs.clean_cache == true }}
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.gradle

      - name: Fix p4a pip compatibility
        run: |
          mkdir -p ~/.buildozer
          echo "PIP_VERSION=23.3.2" >> $GITHUB_ENV

      - name: Patch python-for-android pip upgrade
        run: |
          P4A_DIR=$(find ~/.buildozer -path "*python-for-android" -type d | head -1)

          echo "p4a directory: $P4A_DIR"

          if [ -n "$P4A_DIR" ]; then
            grep -RIl "pip install -U pip" "$P4A_DIR" | xargs -r sed -i 's/pip install -U pip/pip install pip==23.3.2/g'
          fi

      - name: Build APK
        env:
          PIP_VERSION: 23.3.2
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
        run: |
          python --version
          which python
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: apk
          path: bin/*.apk