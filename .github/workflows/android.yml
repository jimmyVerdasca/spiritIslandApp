name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Remove Buildozer cache"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clean Buildozer cache
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            libtool \
            m4 \
            libtool-bin \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

      - name: Select Java 17
        run: |
          sudo update-alternatives --set java \
            /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          sudo update-alternatives --set javac \
            /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create Python virtual environment
        run: |
          cd
          virtualenv --system-site-packages venv_p4a_master
          source venv_p4a_master/bin/activate
          echo "$HOME/venv_p4a_master/bin" >> $GITHUB_PATH

      - name: Install Buildozer dependencies
        run: |
          pip install buildozer setuptools cython==0.29.34

      - name: Refresh autotools
        run: |
          libtoolize --version
          autoreconf --version
          aclocal --version

      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-py312-${{ hashFiles('buildozer.spec') }}

      - name: Initialize database
        run: |
          python3 -m database.init_db

      - name: Print build environment
        run: |
          echo "===== OS ====="
          lsb_release -a || true

          echo
          echo "===== Python ====="
          python --version
          pip --version

          echo
          echo "===== Buildozer ====="
          buildozer --version
          pip show buildozer || true

          echo
          echo "===== Java ====="
          java -version
          javac -version

          echo
          echo "===== Rust ====="
          rustc --version
          cargo --version

          echo
          echo "===== Android ====="
          sdkmanager --version || true

          echo
          echo "===== Autotools ====="
          autoconf --version | head -n1
          automake --version | head -n1
          libtool --version | head -n1
          aclocal --version | head -n1
          pkg-config --version

          echo
          echo "===== CMake ====="
          cmake --version | head -n1

          echo
          echo "===== Buildozer Spec ====="
          grep -E "android.api|android.minapi|android.ndk|android.archs|p4a.branch" buildozer.spec || true

          echo
          echo "===== Environment ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spirit-island-debug
          path: bin/*.apk