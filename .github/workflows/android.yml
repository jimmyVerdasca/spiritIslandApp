name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean Buildozer cache
        if: ${{ inputs.clean_cache == true }}
        run: |
          rm -rf ~/.buildozer/android/platform/android-ndk-*
          rm -rf .buildozer

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool pkg-config

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.36

      - name: Set Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> $GITHUB_PATH

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: apk
          path: bin/*.apk