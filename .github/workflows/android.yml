name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Clean Buildozer cache"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      - uses: actions/checkout@v5

      - name: Clean cache
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.gradle      

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d8fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build APK
        id: build
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: spirit-island-debug-apk
          path: bin/*.apk