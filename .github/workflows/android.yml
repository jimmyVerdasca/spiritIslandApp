name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: "Clean Buildozer Android cache before building"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean Buildozer cache
        if: ${{ inputs.clean_cache == true }}
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.gradle

      - name: Setup Python 3.10.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Verify Python
        run: |
          which python
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Set Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> $GITHUB_PATH

      - name: Install pinned Python tooling
        run: |
          python -m pip install \
            pip==23.3.2 \
            setuptools==68.2.2 \
            wheel==0.41.3

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.36

      - name: Verify Buildozer stack
        run: |
          python --version
          python -m pip --version
          buildozer --version
          python -m pip show cython

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Fix p4a pip compatibility
        run: |
          mkdir -p ~/.buildozer
          echo "PIP_VERSION=23.3.2" >> $GITHUB_ENV

      - name: Patch python-for-android pip
        run: |
          find ~/.buildozer -path "*venv/bin/pip" -type f -exec {} install pip==23.3.2 \;

      - name: Build APK
        env:
          PIP_VERSION: 23.3.2
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: apk
          path: bin/*.apk