name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Clean Buildozer cache"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean cache
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf ~/.gradle

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            python3-venv \
            openjdk-17-jdk \
            git \
            zip \
            unzip

      - name: Install Buildozer
        run: |
          pip install --user \
            buildozer==1.6.0 \
            cython==0.29.36 \
            "sh<2.0"

      - name: Add Buildozer to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Prepare Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: spirit-island-debug-apk
          path: bin/*.apk