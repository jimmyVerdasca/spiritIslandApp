name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Remove Buildozer cache before building"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROIDAPI: 35
      ANDROIDMINAPI: 26

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Clean Buildozer cache
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.gradle
          rm -rf ~/.cache/pip
          rm -rf bin


      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.gradle
            ~/.cache/pip
          key: buildozer-api35-${{ runner.os }}-py310-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-api35-${{ runner.os }}-py310-


      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake


      - name: Set Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH


      - name: Install Android SDK for Buildozer
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | $SDKMANAGER \
            --sdk_root="$SDK" \
            --licenses || true

          $SDKMANAGER \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "SDK installed:"
          ls "$SDK"
          ls "$SDK/build-tools"


      - name: Verify Android SDK
        run: |
          echo "Buildozer SDK:"
          ls ~/.buildozer/android/platform/android-sdk
          ls ~/.buildozer/android/platform/android-sdk/build-tools


      - name: Create database
        run: |
          python -m database.init_db


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip<25" setuptools wheel

          python -m pip install --user \
            buildozer==1.5.0 \
            cython==0.29.36


      - name: Add Buildozer to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH


      - name: Configure Buildozer environment
        run: |
          echo "ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROIDAPI=35" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=26" >> $GITHUB_ENV


      - name: Build APK
        env:
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          buildozer -v android debug


      - name: List APKs
        run: |
          find . -name "*.apk"


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: spirit-island-debug-apk
          path: |
            bin/*.apk
            ./.buildozer/**/*.apk
          if-no-files-found: error