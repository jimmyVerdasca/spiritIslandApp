name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Remove Buildozer cache"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clean Buildozer cache
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

      - name: Select Java 17
        run: |
          sudo update-alternatives --config java
          sudo update-alternatives --config javac

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo ". $HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create Python virtual environment
        run: |
          cd
          virtualenv venv_p4a_master
          source venv_p4a_master/bin/activate

      - name: Install Buildozer dependencies
        run: |
          pip install buildozer setuptools cython==0.29.34

      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-py312-${{ hashFiles('buildozer.spec') }}

      - name: Initialize database
        run: |
          python3 -m database.init_db

      - name: Check environment
        run: |
          python --version
          pip --version
          buildozer --version
          java -version

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spirit-island-debug
          path: bin/*.apk