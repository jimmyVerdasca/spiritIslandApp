name: Build Android APKs

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      clean_build:
        description: "Remove Buildozer cache"
        type: boolean
        default: false


jobs:

  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:

          - name: standalone
            spec: frontend/buildozer-standalone.spec
            package: spirit-island-standalone
            mode: standalone
            initialize_database: true

          - name: http
            spec: frontend/buildozer-http.spec
            package: spirit-island-http
            mode: http
            initialize_database: false

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Clean Buildozer cache
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin


      - name: Install system dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            python3-pip \
            python3-venv \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.36


      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer

          key: buildozer-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles(matrix.spec) }}

      - name: Generate active configuration
        run: |
          if [ "${{ matrix.mode }}" = "standalone" ]; then
            echo "from .standalone import *" > config/active.py
          elif [ "${{ matrix.mode }}" = "http" ]; then
            echo "from .http import *" > config/active.py
          else
            echo "Unknown mode: ${{ matrix.mode }}"
            exit 1
          fi

          cat config/active.py

      - name: Initialize database
        if: ${{ matrix.initialize_database }}
        run: |
          python3 -m shared.database.init_db

      - name: Select Buildozer configuration
        run: |
          cp ${{ matrix.spec }} buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug

      - name: Rename APK
        run: |
          mkdir -p artifacts

          cp bin/*.apk \
            artifacts/${{ matrix.package }}.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: artifacts/${{ matrix.package }}.apk

  # =========================================================
  # BACKEND
  # =========================================================

  backend:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Generate active configuration
        run: |
          echo "from .http import *" > config/active.py
          cat config/active.py


      - name: Create backend virtual environment
        run: |
          python -m venv backend/.venv


      - name: Install backend dependencies
        run: |
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Initialize backend database
        run: |
          backend/.venv/bin/python -m shared.database.init_db

      - name: Verify backend imports
        run: |
          backend/.venv/bin/python -c "import backend.main"


      - name: Test backend application
        run: |
          backend/.venv/bin/python -c \
            "from backend.main import app; print(app.title)"


      - name: Create backend artifact
        run: |
          rm -rf backend/.venv
          rm -rf artifacts

          mkdir -p artifacts/backend

          cp -r backend artifacts/backend/
          cp -r shared artifacts/backend/
          cp -r config artifacts/backend/

          cd artifacts/backend

          zip -r ../spirit-island-backend.zip \
            backend \
            shared \
            config

          cd ../..

          echo "Backend artifact:"
          unzip -l artifacts/spirit-island-backend.zip


      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: spirit-island-backend
          path: artifacts/spirit-island-backend.zip

  android-tests:
    name: Android tests (${{ matrix.mode }})

    runs-on: ubuntu-22.04

    needs:
      - build
      - backend

    strategy:
      matrix:
        mode:
          - standalone
          - http

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # HTTP configuration
      # =====================================================

      - name: Configure HTTP test API URL
        if: matrix.mode == 'http'
        run: |
          echo "SPIRIT_ISLAND_API_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"


      - name: Setup Python
        if: matrix.mode == 'http'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"


      # =====================================================
      # Download frontend
      # =====================================================

      - name: Download standalone APK
        if: matrix.mode == 'standalone'
        uses: actions/download-artifact@v4
        with:
          name: spirit-island-standalone
          path: apk


      - name: Download HTTP APK
        if: matrix.mode == 'http'
        uses: actions/download-artifact@v4
        with:
          name: spirit-island-http
          path: apk


      # =====================================================
      # HTTP backend
      # =====================================================

      - name: Download backend
        if: matrix.mode == 'http'
        uses: actions/download-artifact@v4
        with:
          name: spirit-island-backend
          path: backend-artifact


      - name: Extract backend
        if: matrix.mode == 'http'
        run: |
          mkdir -p backend-runtime

          unzip \
            backend-artifact/spirit-island-backend.zip \
            -d backend-runtime


      - name: Create backend virtual environment
        if: matrix.mode == 'http'
        run: |
          python -m venv backend-runtime/.venv


      - name: Install backend dependencies
        if: matrix.mode == 'http'
        run: |
          backend-runtime/.venv/bin/python \
            -m pip install --upgrade pip

          backend-runtime/.venv/bin/python \
            -m pip install \
            -r backend-runtime/backend/requirements.txt


      - name: Configure backend database
        if: matrix.mode == 'http'
        run: |
          echo "SPIRIT_ISLAND_DB_PATH=$RUNNER_TEMP/android-test.db" >> "$GITHUB_ENV"


      - name: Prepare backend database
        if: matrix.mode == 'http'
        working-directory: backend-runtime
        run: |
          .venv/bin/python -m shared.database.init_db


      - name: Start backend
        if: matrix.mode == 'http'
        working-directory: backend-runtime
        run: |
          .venv/bin/python \
            -m uvicorn \
            backend.main:app \
            > "$RUNNER_TEMP/backend.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/backend.pid"


      - name: Wait for backend
        if: matrix.mode == 'http'
        run: |
          for i in $(seq 1 60); do

            if curl \
              --fail \
              --silent \
              "$SPIRIT_ISLAND_API_URL" \
              > /dev/null
            then
              echo "Backend is ready."
              exit 0
            fi

            sleep 1
          done

          echo "Backend failed to start."
          cat "$RUNNER_TEMP/backend.log"
          exit 1


      # =====================================================
      # Android emulator
      # =====================================================

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm


      - name: Run Android application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none

          disable-animations: true

          script: |
            set -eux

            echo "========================================"
            echo "Android device"
            echo "========================================"

            adb devices

            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.model


            echo "========================================"
            echo "HTTP connectivity"
            echo "========================================"

            if [ "${{ matrix.mode }}" = "http" ]; then
              adb reverse tcp:8000 tcp:8000
              adb reverse --list
            fi


            echo "========================================"
            echo "Install APK"
            echo "========================================"

            APK=$(find apk -name "*.apk" | head -n 1)

            if [ -z "$APK" ]; then
              echo "No APK found."
              exit 1
            fi

            echo "Installing $APK"

            adb install -r "$APK"


            echo "========================================"
            echo "Find package/activity"
            echo "========================================"

            BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"

            PACKAGE=$(
              "$BUILD_TOOLS/aapt" dump badging "$APK" |
              sed -n "s/^package: name='\([^']*\)'.*/\1/p"
            )

            ACTIVITY=$(
              "$BUILD_TOOLS/aapt" dump badging "$APK" |
              sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p"
            )

            echo "PACKAGE=$PACKAGE"
            echo "ACTIVITY=$ACTIVITY"

            test -n "$PACKAGE"
            test -n "$ACTIVITY"


            echo "========================================"
            echo "Launch application"
            echo "========================================"

            adb shell am force-stop "$PACKAGE"

            adb shell am start \
              -n "$PACKAGE/$ACTIVITY"


            echo "========================================"
            echo "Wait for application"
            echo "========================================"

            sleep 15


            echo "========================================"
            echo "Check application process"
            echo "========================================"

            if ! adb shell pidof "$PACKAGE"; then
              echo "Application failed to start."
              adb logcat -d -t 1500
              exit 1
            fi

            echo "Application is running."


            echo "========================================"
            echo "Allow application to initialize"
            echo "========================================"

            sleep 10


            if ! adb shell pidof "$PACKAGE"; then
              echo "Application crashed after startup."
              adb logcat -d -t 1500
              exit 1
            fi


            echo "========================================"
            echo "Android smoke test passed"
            echo "========================================"


      # =====================================================
      # Backend diagnostics
      # =====================================================

      - name: Backend logs
        if: always() && matrix.mode == 'http'
        run: |
          if [ -f "$RUNNER_TEMP/backend.log" ]; then
            cat "$RUNNER_TEMP/backend.log"
          fi


      - name: Stop backend
        if: always() && matrix.mode == 'http'
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend.pid")" || true
          fi