name: Build Android APKs

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      clean_build:
        description: "Remove Buildozer cache"
        type: boolean
        default: false


jobs:

  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:

          - name: standalone
            spec: frontend/buildozer-standalone.spec
            package: spirit-island-standalone
            mode: standalone
            initialize_database: true

          - name: http
            spec: frontend/buildozer-http.spec
            package: spirit-island-http
            mode: http
            initialize_database: false

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Clean Buildozer cache
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin


      - name: Install system dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            python3-pip \
            python3-venv \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.36


      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer

          key: buildozer-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles(matrix.spec) }}

      - name: Generate active configuration
        run: |
          cat > config/active.py << 'EOF'
          MODE = "${{ matrix.mode }}"
          EOF

          cat config/active.py

      - name: Initialize database
        if: ${{ matrix.initialize_database }}
        run: |
          python3 -m shared.database.init_db

      - name: Select Buildozer configuration
        run: |
          cp ${{ matrix.spec }} buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug

      - name: Rename APK
        run: |
          mkdir -p artifacts

          cp bin/*.apk \
            artifacts/${{ matrix.package }}.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: artifacts/${{ matrix.package }}.apk